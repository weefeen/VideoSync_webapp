# Checks, on every push, on both platforms.
#
# Deliberately separate from deployment. VideoScoreSync's workflow deploys to
# production on `pull_request`, which means opening a pull request ships it;
# here a pull request only ever runs these checks.
#
# Why a matrix. Development happens on Windows and the servers are Linux, and
# the differences between them do not announce themselves — they surface as an
# empty result rather than an error. One shipped: `pathlib.Path` treats a
# backslash as an ordinary character on Linux, so every piece the recogniser
# identified on the node resolved to no score, with full confidence and no
# error anywhere. Running the checks on Linux alone would not have caught it;
# neither would running them on Windows alone. Both, every push, is the only
# arrangement that does.
#
# What this can and cannot verify: the app's real work needs ffmpeg, cairo,
# torch and — on Windows — two conda environments, none of which belong in a
# CI runner. `tools/selftest.py` is the part that can be checked anywhere, and
# it is the same script a developer runs locally, so a failure here is
# reproducible there with one command.

name: checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false        # a Windows-only failure must not hide a Linux one
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: checks (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Everything compiles
        run: python -m compileall -q app tools run.py

      # cairo is absent on both runners, which is fine: app/svg.py imports it
      # lazily behind a broad except and falls back to the PNG bands, so this
      # exercises that fallback path on every push as a side effect.
      - name: Checks that must hold on both platforms
        run: python tools/selftest.py
