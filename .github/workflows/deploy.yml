# Deploy chopin.weefeen.com.
#
# Only from `main`, or by hand. NOT on pull_request — the workflow this was
# adapted from deploys on pull_request, which means opening a pull request
# ships to production.
#
# The target is a SHARED box: weefeen's Symfony app, its PHP RabbitMQ
# consumers and the broker itself all live there. Everything destructive in
# the original was removed for that reason; see deploy/deploy.sh for the list.
#
# Secrets this needs (Settings -> Secrets and variables -> Actions):
#   SSH_PRIVATE_KEY    a key whose public half is in vsw@'s authorized_keys
#   SSH_KNOWN_HOSTS    output of `ssh-keyscan chopin.weefeen.com`
#   DEPLOY_HOST        chopin.weefeen.com
#   DEPLOY_USER        vsw   (an unprivileged user, NOT root)
#
# This used to claim that `environment: production` gated it until those
# secrets existed. THAT IS NOT TRUE and merging to main proved it: a GitHub
# environment only gates a job when the environment has protection rules on
# it. With none — or with no such environment at all — the job runs, and it
# died on the first step that needed a key:
#
#     Error: The ssh-private-key argument is empty.
#
# Two changes, so that cannot happen again:
#
#   * it no longer runs on push. There is nowhere to deploy to yet —
#     chopin.weefeen.com does not exist — and a workflow that fails on every
#     merge teaches people to ignore a red mark on main. Put the `push:`
#     trigger back the day the host is real; it is one line, below.
#   * a `configured` job checks the secrets first and skips the deploy when
#     they are missing. Skipped reads as "not set up"; failed reads as
#     "broken", and the difference matters at a glance six months from now.
#     The check has to be its own job because the `secrets` context is not
#     available in a job-level `if`.

name: deploy

on:
  # push:
  #   branches: [main]       # <- uncomment when the production host exists
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy"
        required: false
        default: main

permissions:
  contents: read

concurrency:
  # Two deploys rsyncing into the same tree at once would interleave files.
  group: deploy-production
  cancel-in-progress: false

jobs:
  configured:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          missing=""
          [ -n "$KEY" ]  || missing="$missing SSH_PRIVATE_KEY"
          [ -n "$HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$USER" ] || missing="$missing DEPLOY_USER"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment is not configured; skipping. Missing:$missing"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: configured
    if: needs.configured.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Name this release
        id: release
        run: echo "name=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the host
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Can we reach the host at all?
        # Separated from the rsync so a connection problem says so, instead
        # of surfacing as "exit code 1" on a step that was going to copy
        # 15 MB.
        #
        # The reason is emitted as a ::error:: annotation, not merely printed.
        # That is the whole point of this rewrite. GitHub's run summary shows
        # annotations; a failing `run:` step contributes only "Process
        # completed with exit code 1" to it, and anything the step wrote goes
        # to the log, one click further in. Two deploys were reported here as
        # "exit code 1" with the actual cause sitting unread in the log.
        #
        # `ssh -v` so the reason is in the output to be found at all, and a
        # grep for the handful of messages that distinguish the four ways
        # this fails.
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo "connecting as $USER@$HOST"
          set +e
          OUT=$(ssh -v -o BatchMode=yes -o ConnectTimeout=15 "$USER@$HOST" "echo reached" 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          if [ "$RC" -eq 0 ]; then exit 0; fi

          WHY=$(echo "$OUT" | grep -iE "permission denied|host key verification failed|invalid format|error in libcrypto|connection timed out|connection refused|could not resolve|no matching host key" | head -2 | tr '\n' ' ')
          echo "::error title=Deploy could not log in::${WHY:-no recognised error, see the log} (user=$USER host=$HOST rc=$RC)"

          case "$WHY" in
            *nvalid?format*|*libcrypto*)
              echo "::error title=How to fix::SSH_PRIVATE_KEY is not a complete key. Re-copy the whole file including the BEGIN and END lines and the final newline." ;;
            *ost?key?verification*|*o?matching?host?key*)
              echo "::error title=How to fix::SSH_KNOWN_HOSTS does not match this host. Use every line that 'ssh-keyscan $HOST' prints." ;;
            *ermission?denied*)
              echo "::error title=How to fix::The key loaded but the server refused it. Check DEPLOY_USER and that the public half is in that user's authorized_keys." ;;
            *imed?out*|*efused*|*esolve*)
              echo "::error title=How to fix::A GitHub runner cannot reach $HOST on port 22. Check the address and any cloud firewall." ;;
          esac
          exit 1

      - name: Send the release
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          REL: ${{ steps.release.outputs.name }}
        run: |
          set -euo pipefail
          ssh "$USER@$HOST" "mkdir -p /mnt/volume_1/vsw/releases/$REL"
          # --delete so a file removed from the repo is removed from the
          # release; the excludes are the things that must never be shipped
          # or must never be overwritten on the server.
          rsync -az --delete \
            --exclude '.git' --exclude '.github' \
            --exclude '.env' --exclude 'var' \
            --exclude '__pycache__' --exclude '*.pyc' \
            --exclude '.venv' \
            ./ "$USER@$HOST:/mnt/volume_1/vsw/releases/$REL/"

      - name: Put it live
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          REL: ${{ steps.release.outputs.name }}
        run: |
          set -euo pipefail
          ssh "$USER@$HOST" "bash /mnt/volume_1/vsw/releases/$REL/deploy/deploy.sh $REL"

      - name: Say what is live
        if: always()
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: ssh "$USER@$HOST" "readlink -f /mnt/volume_1/vsw/current" || true
